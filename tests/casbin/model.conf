[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
# 1. Check Role Inheritance (RBAC) OR Direct Subject Match (ACL)
# 2. Check Object Match (supports wildcards/keyMatch for ABAC-like paths)
# 3. Check Action Match
m = g(r.sub, p.sub) && keyMatch(r.obj, p.obj) && r.act == p.act